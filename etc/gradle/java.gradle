/**
 * Javaのコンパイル＆テストの設定
 */
// 文字コードの設定
ext {
    defaultEncoding = 'UTF-8'
}

// 環境ごとにデフォルト文字コードが違うので、コンパイル時の文字コードを指定する
compileJava.options.encoding = defaultEncoding
compileGroovy.options.encoding = defaultEncoding
compileTestJava.options.encoding = defaultEncoding
compileTestGroovy.options.encoding = defaultEncoding

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }

    test {
        java.srcDirs = []
        groovy.srcDirs = ['src/test/java', 'src/test/groovy']
        resources.srcDirs = ['src/test/resources']
    }

    integrationTest {
        java.srcDirs = []
        groovy.srcDirs = ['src/integrationTest/java', 'src/integrationTest/groovy']
        resources.srcDirs = ['src/integrationTest/resources']
        compileClasspath = sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath = output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

compileIntegrationTestGroovy.options.encoding = defaultEncoding

// コンパイル時に非推奨クラスの警告を表示する
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked" << "-implicit:class"
}
tasks.withType(GroovyCompile) {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked" << "-implicit:class"
}

// gradlew bootRun コマンド実行時の処理の設定
bootRun {
    systemProperties 'spring.profiles.active': System.properties['spring.profiles.active']
}

// gradlew test コマンド実行時の処理の設定
test {
    // テスト失敗時の情報を標準より多く出力する設定
    testLogging.exceptionFormat = 'full'
    // GradleでEnclosedテストが2回実行されることの対策（そのうちGradle側で対応してくれるようになるかも）
    exclude '**/*$*'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('unitTests') {
    description = 'Runs the unit tests.'
    group = 'verification'
    dependsOn tasks.named('test')
}

tasks.register('integrationTests', Test) {
    description = 'Runs integration tests against the local MySQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    dependsOn tasks.named('flywayMigrate')
    shouldRunAfter test
    useJUnitPlatform()
}

tasks.register('integrationTest') {
    description = 'Compatibility alias for integrationTests.'
    group = 'verification'
    dependsOn tasks.named('integrationTests')
}
